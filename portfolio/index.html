<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <link rel="stylesheet" href="./css/wireframe.css" />
</head>
<body>
  <main class="deck">
    <button class="arrow arrow-left" id="prevBtn">←</button>

    <section class="slide active" data-slide="0">
      <h1>Start</h1>
      <p>Welcome to my portfolio.</p>
    </section>

    <section class="slide" data-slide="1">
      <h1>About</h1>
      <p>A short introduction goes here.</p>
    </section>

    <section class="slide" data-slide="2">
      <h1>Projects</h1>
      <p>Selected work will go here.</p>
    </section>

    <section class="slide" data-slide="3">
      <h1>Contact</h1>
      <p>Contact details go here.</p>
    </section>

    <button class="arrow arrow-right" id="nextBtn">→</button>

    <nav class="slide-nav" id="slideNav">
      <button data-target="0" class="nav-pill active" aria-label="Start"></button>
      <button data-target="1" class="nav-pill" aria-label="About"></button>
      <button data-target="2" class="nav-pill" aria-label="Projects"></button>
      <button data-target="3" class="nav-pill" aria-label="Contact"></button>
    </nav>
  </main>

  <script src="./js/main.js"></script>
</body>
</html>
